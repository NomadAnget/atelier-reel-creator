# atelier-reel-creator 基建配置(重启级)。域根=src;含监控 + 自动发布(网关 + publishers 进程域懒子进程)。

[paths]
journal_db = "data/hub/journal.db"
store_db   = "data/hub/store.db"
models_dir = "/home/Architecture/checkpoints"   # 复用现有权重(绝对路径)

[web]
enabled    = true
host       = "0.0.0.0"
port       = 8098
dist_dir   = "frontend/dist"           # 共享前端子模块(atelier-frontend);单一构建,页面按后端能力动态显隐
# 排除页(域挂着但本变体不显):个人版无闲时排产(有 daemons 但不跑 SchedulerService)。
# 新闻日报/总线观测无需列——无 news_digest 管线/无 sentinel 域,前端自动隐藏。
hide_pages = ["scheduler"]

[gateway]
enabled        = true                # publishers = 进程域(KIND=process),网关按需拉起子进程转发
host           = "127.0.0.1"
port           = 8792
token          = ""
ack_timeout    = 1200.0              # 发布=浏览器自动化,留余量
remote_domains = []                  # publishers 不再是外部远程域;进程域懒子进程由组装点自动登记

[supervisor]

# bgutil POT 供给器(YouTube 采集防风控):node HTTP 服务,动态端口;需先 npm ci && npm run build
[[supervisor.children]]
name = "bgutil"
cmd  = ["node", "server/build/main.js", "--port", "{port}"]
cwd  = "src/services/bgutil-server"
dynamic_port = true

# 注:publishers 已由外部 publish-engine 边车改为**进程域**(build.py KIND=process)——
# 懒子进程 `python -m atelier_core.boot.remote publishers src` 由组装点自动登记,config 零声明。

# 注:监控源上限(5)是 daemons_settings.max_channels,由 main.py 启动时钉为 5(非本文件)。
