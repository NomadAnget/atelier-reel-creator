# atelier-reel-creator 基建配置(重启级)。域根=src;含监控 + 自动发布(网关 + 发布引擎)。

[paths]
journal_db = "data/hub/journal.db"
store_db   = "data/hub/store.db"
models_dir = "/home/Architecture/checkpoints"   # 复用现有权重(绝对路径)

[web]
enabled  = true
host     = "0.0.0.0"
port     = 8098
dist_dir = "frontend/dist"           # in-repo 前端(改自全功能:Monitor+Accounts+Jobs)

[gateway]
enabled        = true                # 发布引擎作 publishers 远程域经 ws 接入总线
host           = "127.0.0.1"
port           = 8792
token          = ""
ack_timeout    = 1200.0              # 发布=浏览器自动化,留余量
remote_domains = ["publishers"]      # publishers 的异地实现 = publish-engine

[supervisor]

# bgutil POT 供给器(YouTube 采集防风控):node HTTP 服务,动态端口;需先 npm ci && npm run build
[[supervisor.children]]
name = "bgutil"
cmd  = ["node", "server/build/main.js", "--port", "{port}"]
cwd  = "src/services/bgutil-server"
dynamic_port = true

# 发布引擎(publishers 远程域实现):python 服务,自取网关地址接入
[[supervisor.children]]
name = "publish-engine"
cmd  = ["uv", "run", "python", "run.py"]
cwd  = "src/services/publish-engine"
env  = { BUS_GATEWAY_URL = "ws://127.0.0.1:8792", PUBLISH_ENGINE_PORT = "8802", PUBLISH_ENGINE_LOG_LEVEL = "INFO" }

# 注:监控源上限(5)是 daemons_settings.max_channels,由 main.py 启动时钉为 5(非本文件)。
