name: Deploy to Media Dashboard

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 把宿主机的网站目录直接挂进任务容器，build 后直接写入，无需 SSH
    container:
      image: node:lts
      volumes:
        - /opt/1panel/www/sites/media.hurcaguari.top/index:/deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to website directory
        run: |
          # 自动识别构建输出目录（vite=dist, CRA=build）
          if [ -d "dist" ]; then
            BUILD_DIR="dist"
          elif [ -d "build" ]; then
            BUILD_DIR="build"
          else
            echo "❌ 找不到 dist/ 或 build/ 构建输出目录"; exit 1
          fi
          echo "构建输出目录: $BUILD_DIR"

          # 清空旧文件并复制新构建产物到挂载的网站目录
          rm -rf /deploy/*
          cp -r "$BUILD_DIR"/. /deploy/
          chmod -R 755 /deploy

          echo "✅ 已部署 $(find /deploy -type f | wc -l) 个文件到网站目录"